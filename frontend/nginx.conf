server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow the backend's default 50 MiB PDF cap plus multipart form overhead.
    # Nginx defaults to 1 MiB, which otherwise rejects uploads before FastAPI.
    # If PDF2MD_MAX_UPLOAD_BYTES is raised, increase this limit accordingly.
    client_max_body_size 64m;

    # API + SSE: proxy_buffering off so progress events stream in real time
    location = /metrics { return 404; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Serve CSP-compatible, self-hosted docs pages; keep the schema proxied to FastAPI.
    location = /docs        { rewrite ^ /docs.html last; }
    location = /docs/       { rewrite ^ /docs.html last; }
    location = /redoc       { rewrite ^ /redoc.html last; }
    location = /redoc/      { rewrite ^ /redoc.html last; }
    location = /openapi.json { proxy_pass http://api:8000/openapi.json; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /healthz     { proxy_pass http://api:8000/healthz;     proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /readyz      { proxy_pass http://api:8000/readyz;      proxy_http_version 1.1; proxy_set_header Host $host; }
}
