server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow the backend's default 50 MiB PDF cap plus multipart form overhead.
    # Nginx defaults to 1 MiB, which otherwise rejects uploads before FastAPI.
    # If PDF2MD_MAX_UPLOAD_BYTES is raised, increase this limit accordingly.
    client_max_body_size 64m;

    # API + SSE: proxy_buffering off so progress events stream in real time
    location /api/ {
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /docs        { proxy_pass http://api:8000/docs;        proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /redoc       { proxy_pass http://api:8000/redoc;       proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://api:8000/openapi.json; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /healthz     { proxy_pass http://api:8000/healthz;     proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /readyz      { proxy_pass http://api:8000/readyz;      proxy_http_version 1.1; proxy_set_header Host $host; }
}
